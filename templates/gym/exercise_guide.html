{% load i18n static %}
{% if exercise.media %}<section class="panel gym-guide"><div class="section-heading"><h2>{% translate "MOVEMENT REFERENCE" %}</h2></div><p class="help-text">{% translate "Reference variation" %}: <bdi>{{ exercise.media.name }}</bdi></p><div class="gym-guide-images">{% for image in exercise.media.images %}<figure><img src="{% static image %}" alt="{{ exercise.media.name }} · {{ forloop.counter }}" width="512" height="512" loading="lazy" decoding="async"><figcaption>{% if forloop.first %}{% translate "Start position" %}{% else %}{% translate "Movement position" %}{% endif %}</figcaption></figure>{% endfor %}</div></section>{% endif %}
