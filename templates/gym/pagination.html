{% load i18n %}{% if page.has_other_pages %}<nav class="gym-pagination" aria-label="{% translate 'Pages' %}">{% if page.has_previous %}<a class="button subtle" href="?{{ params }}&amp;page={{ page.previous_page_number }}">← {% translate "Previous" %}</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button subtle" href="?{{ params }}&amp;page={{ page.next_page_number }}">{% translate "Next" %} →</a>{% endif %}</nav>{% endif %}
