{% load i18n %}
<aside class="gym-rest" data-rest-panel aria-label="{% translate 'Rest timer' %}"><div class="gym-rest-main"><span class="gym-rest-icon">{% include 'icon.html' with name='timer' %}</span><div><span class="eyebrow">{% translate "REST TIMER" %}</span><strong data-rest-clock aria-live="off">00:00</strong></div><div class="gym-rest-controls"><form method="post" action="{% url 'gym:workout-action' session.pk %}" data-gym-save>{% csrf_token %}<input type="hidden" name="version" value="{{ session.version }}"><input type="hidden" name="action" value="timer"><input type="hidden" name="command" value="extend"><button class="quiet-button" name="seconds" value="-30" aria-label="{% translate 'Remove 30 seconds' %}">−30</button><button class="quiet-button" name="seconds" value="30" aria-label="{% translate 'Add 30 seconds' %}">+30</button></form><form method="post" action="{% url 'gym:workout-action' session.pk %}" data-gym-save>{% csrf_token %}<input type="hidden" name="version" value="{{ session.version }}"><input type="hidden" name="action" value="timer"><button class="quiet-button" name="command" value="pause" data-timer-pause>{% translate "Pause" %}</button><button class="quiet-button" name="command" value="resume" data-timer-resume hidden>{% translate "Resume" %}</button><button class="quiet-button" name="command" value="cancel">{% translate "Skip" %}</button></form></div></div><details><summary>{% translate "Timer options" %}</summary><div class="gym-rest-options"><form method="post" action="{% url 'gym:workout-action' session.pk %}" data-gym-save>{% csrf_token %}<input type="hidden" name="version" value="{{ session.version }}"><input type="hidden" name="action" value="timer"><input type="hidden" name="command" value="start"><label for="rest-seconds">{% translate "Seconds" %}</label><input id="rest-seconds" type="number" name="seconds" value="90" min="1" max="1800"><button class="button subtle">{% translate "Start timer" %}</button></form><label class="check-label"><input type="checkbox" data-timer-sound>{% translate "Sound when rest ends" %}</label><label class="check-label" data-wake-label hidden><input type="checkbox" data-keep-awake>{% translate "Keep screen awake" %}</label></div></details><span class="sr-only" data-timer-announcement role="status"></span></aside>
