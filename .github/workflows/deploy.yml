name: Publish production image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cotinga-production-image
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and check the production image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --platform linux/amd64 --build-arg "COTINGA_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$GITHUB_SHA" .
          docker run --rm --read-only --tmpfs /tmp --tmpfs /data:uid=10001,gid=10001 \
            --env DJANGO_SECRET_KEY=ci-image-check-only-with-length-and-variety-9284-no-runtime-use \
            --env DJANGO_ALLOWED_HOSTS=example.com "$image:$GITHUB_SHA" \
            sh -c 'python manage.py prepare_deployment && python manage.py check --deploy --fail-level WARNING'
          docker run --rm --env COTINGA_DOMAIN=example.com --env COTINGA_TLS_EMAIL=ci@example.com \
            --volume "$PWD/deploy/ec2/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          echo "COTINGA_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Publish the tested image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$COTINGA_IMAGE:$GITHUB_SHA"
          latest=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit exists; leaving the production tag unchanged.'
            exit 0
          fi
          docker tag "$COTINGA_IMAGE:$GITHUB_SHA" "$COTINGA_IMAGE:production"
          docker push "$COTINGA_IMAGE:production"
          printf 'Published %s:production from %s.\n' "$COTINGA_IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
