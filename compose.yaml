services:
  web:
    build: .
    ports:
      - "127.0.0.1:${COTINGA_PORT:-8000}:8000"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local_example
      DJANGO_SQLITE_PATH: /data/db.sqlite3
    volumes:
      - cotinga_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  cotinga_data:
    # Explicitly created outside Compose. Even down --volumes leaves it intact.
    external: true
    name: ${COTINGA_DATA_VOLUME:-cotinga_data}
